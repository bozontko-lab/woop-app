<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
    <script>
      // Apply the theme before the first paint (no flash). Mirrors src/app/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f1417' : '#faf7f2');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="print-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
